<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Error — BusTrack</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <style>
      body { overflow:hidden; }
      .error-wrap { width:100%; max-width:460px; padding:48px 40px; text-align:center; }
      .icon-ring {
        width:80px; height:80px; border-radius:50%;
        background: rgba(239, 68, 68, 0.05);
        border: 2px solid rgba(239, 68, 68, 0.2);
        display:flex; align-items:center; justify-content:center;
        margin:0 auto 24px;
      }
      .page-scene {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        z-index: 10;
        pointer-events: none;
      }
      .error-wrap { 
        pointer-events: auto;
        width:100%; 
        max-width:460px; 
        padding:48px 40px; 
        text-align:center; 
        margin: 0 auto;
      }
      .error-wrap h2 {
        font-size:28px; font-weight:800; letter-spacing:-0.02em; margin-bottom:12px;
        background: linear-gradient(135deg, #fff, #f87171);
        -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      }
      .error-wrap p { font-size:14px; color:var(--muted); line-height:1.7; margin-bottom:28px; }
      
      .error-details {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.2);
        color: #fca5a5;
        border-radius: 12px;
        padding: 16px;
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-size: 12px;
        text-align: left;
        margin-bottom: 24px;
        word-break: break-all;
      }

      .home-btn {
        display:inline-flex; align-items:center; gap:8px;
        padding:13px 28px;
        font-family:'Inter',sans-serif; font-size:14px; font-weight:700; color:#fff;
        background: linear-gradient(135deg, #ef4444, #b91c1c);
        border:none; border-radius:14px; cursor:pointer; text-decoration:none;
        box-shadow:0 8px 28px rgba(239, 44, 44, 0.3);
        transition: transform 0.2s, box-shadow 0.2s;
      }
      .home-btn:hover { transform:translateY(-2px); box-shadow:0 14px 36px rgba(239, 44, 44, 0.4); }
    </style>
  </head>
  <body>
    <div id="cursor"></div>
    <div id="aura"></div>
    <canvas id="stars"></canvas>
    <div class="road-plane"></div>
    <div class="particles" id="particles"></div>

    <nav class="topbar">
      <div style="display:flex; align-items:center; gap:16px;">
        <a href="/home" class="menu-icon" style="width:36px; height:36px; text-decoration:none; color:var(--cyan);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </a>
        <div class="topbar-brand">BusTrack</div>
      </div>
    </nav>

    <div class="page-scene">
      <div class="card error-wrap">
        <div class="icon-ring">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>

        <h2>System Connectivity Issue</h2>
        <p>
          We're having trouble connecting to our services. This is usually temporary. Please check your connection and try again.
        </p>

        {% if error %}
        <div class="error-details">
          <strong>Error Code:</strong><br>
          {{ error }}
        </div>
        {% endif %}

        <a href="/" class="home-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
          Back to Home
        </a>
      </div>
    </div>

    <script src="{{ url_for('static', filename='css/anim.js') }}"></script>
  </body>
</html>
